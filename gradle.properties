org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.code.style=official
kotlin.native.ignoreDisabledTargets=true
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.resvalues=false
android.enableAppCompileTimeRClass=true
android.usesSdkInManifest.disallowed=true
android.uniquePackageNames=true
android.dependency.useConstraints=false
android.r8.strictFullModeForKeepRules=true
android.r8.optimizedResourceShrinking=true
android.builtInKotlin=false
android.newDsl=false
# Known, tracked in P1-2: composeApp still applies com.android.application next to the KMP plugin. AGP 9 only
# allows that through the opt-outs above; the proper fix is a separate androidApp module. Silence the noise until then.
android.sync.suppressAgpWarnings=DEPRECATED_DSL,UNSUPPORTED_PROJECT_OPTION_USE

# App version: single source of truth for Android and iOS (run :composeApp:syncIosVersion after changing)
appVersionName=1.1.3
appVersionCode=6
