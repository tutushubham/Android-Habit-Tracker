# Dependency update PRs (GitHub Dependabot). Weekly, grouped so related libraries move together; the CI that runs
# `./gradlew check` on these PRs is set up in plan B1. Policy: never merge an update that changes behaviour without
# the same test + screenshot checks as any other change (docs/production-plan/part-1-local/P1-2-*.md, step 7).
version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      kotlin-and-compose:
        patterns:
          - "org.jetbrains.kotlin*"
          - "org.jetbrains.compose*"
          - "org.jetbrains.androidx*"
          - "com.android.tools.build*"
          - "com.android.application"
      ktor:
        patterns:
          - "io.ktor*"
      sqldelight:
        patterns:
          - "app.cash.sqldelight*"
      kotlinx:
        patterns:
          - "org.jetbrains.kotlinx*"
      code-quality:
        patterns:
          - "com.diffplug.spotless*"
          - "io.gitlab.arturbosch.detekt*"
          - "com.pinterest.ktlint*"
